<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e31e24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>FTC — Full Throttle Championship</title>
<style>
:root{--bg:#080808;--panel:#121212;--panel2:#181818;--line:#2b2b2b;--text:#f4f4f4;--muted:#a8a8a8;--red:#e31e24;--green:#32d583}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#191919 0,#080808 45%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0 18px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;border-radius:13px}.brand h1{font-size:21px;margin:0}.brand small{color:var(--muted)}.status{font-size:13px;color:var(--muted)}.status b{color:var(--green)}nav{display:flex;gap:8px;overflow:auto;padding-bottom:14px}nav button,.btn{background:#1a1a1a;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px 14px}nav button.active,.btn.primary{background:var(--red);border-color:var(--red)}.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:14px}.card{background:linear-gradient(180deg,#151515,#101010);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px #0005}.card h2{margin:0 0 12px;font-size:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#191919;border:1px solid var(--line);border-radius:12px;padding:13px}.stat strong{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid #242424;text-align:left;white-space:nowrap}.table th{font-size:12px;color:var(--muted);text-transform:uppercase}.table td:nth-child(n+2),.table th:nth-child(n+2){text-align:right}.rank{font-weight:800;color:var(--muted)}.pts{font-weight:900;font-size:18px}.team-dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:7px;border:1px solid #fff8;box-shadow:0 0 0 1px #000}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}.toolbar .right{display:flex;gap:8px}.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#211416;border:1px solid #5d2528;color:#ffced0;margin-bottom:12px}.ok{background:#102118;border-color:#205a3d;color:#b9f3d1}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}.form input,.form select{background:#0c0c0c;border:1px solid var(--line);color:#fff;border-radius:9px;padding:11px}.result-row{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;margin:7px 0}.result-row input{background:#0c0c0c;border:1px solid var(--line);color:#fff;border-radius:8px;padding:9px}.race{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;background:#111}.race-head{display:flex;justify-content:space-between;gap:10px}.race-head b{font-size:15px}.calendar-item{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:13px;margin:8px 0;background:#111}.calendar-date{font-weight:900;text-align:center;background:#191919;border:1px solid var(--line);border-radius:10px;padding:8px}.calendar-date strong{display:block;font-size:22px}.calendar-date span{font-size:11px;color:var(--muted);text-transform:uppercase}.calendar-info b{font-size:15px}.race-flag{font-size:22px;margin-right:8px;vertical-align:-2px}.calendar-country{display:block;color:var(--muted);font-size:11px;margin-top:3px}.calendar-info .muted{display:block;margin-top:4px}.calendar-badge{font-size:11px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}.calendar-badge.next{color:#b9f3d1;border-color:#205a3d;background:#102118}.calendar-badge.done{color:#aaa;background:#181818}.calendar-badge.upcoming{color:#ffd8d8;background:#211416;border-color:#5d2528}@media(max-width:600px){.calendar-item{grid-template-columns:76px 1fr}.calendar-badge{grid-column:2;justify-self:start}}.muted{color:var(--muted);font-size:12px}.empty{padding:25px;text-align:center;color:var(--muted)}.login{max-width:420px;margin:30px auto}.footer{padding:30px 0;text-align:center;color:#777;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.top{align-items:flex-start}.brand h1{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><img src="icon-192.png" alt="FTC"><div><h1>FTC — Full Throttle Championship</h1><small>Classifiche online e sincronizzate</small></div></div><div class="status" id="status">Connessione: <b>online</b></div></header>
<nav id="nav"><button data-page="home" class="active">Classifiche</button><button data-page="calendar">Calendario</button><button data-page="races">Gare</button><button data-page="admin">Admin</button></nav>
<main id="app"></main>
<div class="footer">FTC • dati sincronizzati tramite Firebase Realtime Database</div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
import { getDatabase, ref, onValue, push, set, remove } from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js';
import { firebaseConfig } from './firebase-config.js';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const POINTS=[25,19,15,12,10,8,6,4,2,1];
const TEAMS=['Alpine','Aston Martin','Audi','Cadillac','Ferrari','Haas','McLaren','Mercedes','Vcarb','Red Bull','Williams'];
const TEAM_COLORS={Alpine:'#00A1E8','Aston Martin':'#229971','Audi':'#F50537','Cadillac':'#AAAAAD','Ferrari':'#E8002D','Haas':'#E6002B','McLaren':'#FF8000','Mercedes':'#27F4D2','Vcarb':'#6692FF','Red Bull':'#3671C6','Williams':'#1868DB'};
const DRIVERS=[
 ['GolfDavi',93,'Alpine'],['BraccioPotente',51,'Alpine'],['Luigi',14,'Aston Martin'],['RickyJuve',47,'Aston Martin'],['Gabbo',12,'Audi'],['DeMalattia',16,'Audi'],['Leone',77,'Cadillac'],['GyAndre',2,'Cadillac'],['Andrea',49,'Ferrari'],['Ricky',41,'Ferrari'],['Goofydesert',32,'Haas'],['Audio',15,'Haas'],['Gabri',28,'McLaren'],['IlBaddi',67,'McLaren'],['Red',1,'Mercedes'],['Ninja',89,'Mercedes'],['Chompyx',45,'Vcarb'],['Gabry',48,'Vcarb'],['Casalena',5,'Red Bull'],['Nicognana',11,'Red Bull'],['Gose',21,'Williams'],['Axer',33,'Williams']
].map(([name,num,team])=>({name,num,team}));
let races={}; let calendar={}; let user=null; let page='home';
const appEl=document.getElementById('app');
const nav=document.getElementById('nav');

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function calc(){
 const ds=DRIVERS.map(d=>({...d,points:0,wins:0,podiums:0,starts:0})); const map=new Map(ds.map(d=>[d.name,d]));
 Object.values(races).forEach(r=>{(r.results||[]).forEach((name,i)=>{const d=map.get(name); if(!d)return; d.points+=POINTS[i]||0; d.starts++; if(i===0)d.wins++; if(i<3)d.podiums++;});});
 const drivers=[...ds].sort((a,b)=>b.points-a.points||b.wins-a.wins||a.name.localeCompare(b.name));
 const teams=TEAMS.map(team=>{const members=ds.filter(d=>d.team===team);return {team,points:members.reduce((s,d)=>s+d.points,0),wins:members.reduce((s,d)=>s+d.wins,0),members};}).sort((a,b)=>b.points-a.points||b.wins-a.wins||a.team.localeCompare(b.team));
 return {drivers,teams};
}
function driverTable(){const {drivers}=calc(); return `<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Pilota</th><th>Team</th><th>G</th><th>V</th><th>Podi</th><th>Pt</th></tr></thead><tbody>${drivers.map((d,i)=>`<tr><td class="rank">${i+1}</td><td><b>${esc(d.name)}</b> <span class="muted">#${d.num}</span></td><td><span class="team-dot" style="background:${TEAM_COLORS[d.team]||'#e33b36'}"></span>${esc(d.team)}</td><td>${d.starts}</td><td>${d.wins}</td><td>${d.podiums}</td><td class="pts">${d.points}</td></tr>`).join('')}</tbody></table></div>`}
function teamTable(){const {teams}=calc();return `<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Team</th><th>V</th><th>Pt</th></tr></thead><tbody>${teams.map((t,i)=>`<tr><td class="rank">${i+1}</td><td><span class="team-dot" style="background:${TEAM_COLORS[t.team]||'#e33b36'}"></span><b>${esc(t.team)}</b></td><td>${t.wins}</td><td class="pts">${t.points}</td></tr>`).join('')}</tbody></table></div>`}
function stats(){const {drivers}=calc();return `<div class="stats"><div class="stat"><strong>${Object.keys(races).length}</strong><span>Gare</span></div><div class="stat"><strong>${drivers[0]?.points||0}</strong><span>Leader punti</span></div><div class="stat"><strong>${drivers[0]?.name||'—'}</strong><span>Leader</span></div><div class="stat"><strong>${drivers.filter(d=>d.points>0).length}</strong><span>Piloti a punti</span></div></div>`}
function renderHome(){appEl.innerHTML=`<section class="grid"><div class="card"><div class="toolbar"><h2>🏆 Classifica Piloti</h2><span class="muted">Aggiornamento automatico</span></div>${driverTable()}</div><div class="card"><div class="toolbar"><h2>🏎️ Classifica Team</h2></div>${teamTable()}</div></section><div style="height:14px"></div><div class="card">${stats()}</div>`}
function formatDate(value){if(!value)return '—'; const d=new Date(value+'T12:00:00'); return new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'short'}).format(d).replace('.','');}
function calendarStatus(date){if(!date)return {label:'Da definire',cls:'upcoming'}; const today=new Date(); today.setHours(0,0,0,0); const d=new Date(date+'T00:00:00'); if(d<today)return {label:'Disputata',cls:'done'}; if(d.getTime()===today.getTime())return {label:'Oggi',cls:'next'}; return {label:'In programma',cls:'upcoming'};}
function renderCalendar(){
 const arr=Object.entries(calendar).sort((a,b)=>(a[1].date||'9999-12-31').localeCompare(b[1].date||'9999-12-31'));
 const todayKey=new Date().toISOString().slice(0,10);
 const next=arr.find(([id,r])=>r.date&&r.date>=todayKey);
 const items=arr.map(([id,r])=>{
  const st=calendarStatus(r.date);
  const dateHtml=r.date?'<strong>'+esc(new Date(r.date+'T12:00:00').getDate())+'</strong><span>'+esc(new Intl.DateTimeFormat('it-IT',{month:'short'}).format(new Date(r.date+'T12:00:00')).replace('.',''))+'</span>':'<strong>?</strong><span>data</span>';
  const trackHtml=r.track?'<span class="muted">📍 '+esc(r.track)+'</span>':'';
  const timeHtml=r.time?'<span class="muted">🕒 '+esc(r.time)+'</span>':'';
  const nextLabel=next&&next[0]===id?' • Prossima':'';
  return '<div class="calendar-item"><div class="calendar-date">'+dateHtml+'</div><div class="calendar-info"><b>'+(r.flag?'<span class="race-flag">'+esc(r.flag)+'</span>':'')+esc(r.name||'Gara FTC')+'</b>'+(r.country?'<span class="calendar-country">'+esc(r.country)+'</span>':'')+trackHtml+timeHtml+'</div><span class="calendar-badge '+st.cls+'">'+st.label+nextLabel+'</span></div>';
 }).join('');
 appEl.innerHTML='<div class="card"><div class="toolbar"><div><h2>📅 Calendario gare</h2><span class="muted">Programma ufficiale FTC — sincronizzato in tempo reale</span></div><span class="muted">'+arr.length+' appuntamenti</span></div>'+(items||'<div class="empty">Nessuna gara in calendario. L\'Admin può aggiungerla dal pannello Admin.</div>')+'</div>';
}
function renderRaces(){const arr=Object.entries(races).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));appEl.innerHTML=`<div class="card"><div class="toolbar"><h2>🏁 Storico gare</h2><span class="muted">${arr.length} gare</span></div>${arr.length?arr.map(([id,r])=>`<div class="race"><div class="race-head"><div><b>${esc(r.name)}</b><div class="muted">${esc(r.date||'')}</div></div><div class="muted">${(r.results||[]).length} classificati</div></div><ol>${(r.results||[]).map((n,i)=>`<li><b>${esc(n)}</b> — ${POINTS[i]||0} pt</li>`).join('')}</ol></div>`).join(''):'<div class="empty">Nessuna gara ancora inserita.</div>'}</div>`}
function renderAdmin(){if(!user){appEl.innerHTML=`<div class="card login"><h2>🔐 Area Admin</h2><div class="notice">Accedi con l'account Admin Firebase per inserire risultati e gestire il calendario.</div><form id="loginForm"><div class="form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label></div><div style="height:10px"></div><button class="btn primary" type="submit">Accedi</button></form><div id="loginMsg" class="muted" style="margin-top:10px"></div></div>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('loginMsg');try{await signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('password').value);msg.textContent='Accesso eseguito.'}catch(err){msg.textContent='Accesso non riuscito: controlla email e password.';}};return;}
 const opts=DRIVERS.map(d=>`<option value="${esc(d.name)}">${esc(d.name)} #${d.num} — ${esc(d.team)}</option>`).join('');
 const calItems=Object.entries(calendar).sort((a,b)=>(a[1].date||'9999-12-31').localeCompare(b[1].date||'9999-12-31'));
 appEl.innerHTML=`<div class="card"><div class="toolbar"><div><h2>👑 Pannello Admin</h2><span class="muted">${esc(user.email)}</span></div><div class="right"><button id="logout" class="btn">Esci</button></div></div><div class="notice ok">Sei autenticato. Puoi gestire risultati e calendario. Le modifiche vengono sincronizzate in tempo reale.</div><h3>📅 Aggiungi gara al calendario</h3><form id="calendarForm"><div class="form"><label>Nome gara<input id="calendarName" required placeholder="es. GP del Mugello"></label><label>Data<input id="calendarDate" type="date" required></label><label>Circuito / luogo<input id="calendarTrack" placeholder="es. Mugello"></label><label>Stato / bandiera<select id="calendarCountry"><option value="">Nessuna</option><option value="🇮🇹|Italia">🇮🇹 Italia</option><option value="🇦🇹|Austria">🇦🇹 Austria</option><option value="🇧🇪|Belgio">🇧🇪 Belgio</option><option value="🇧🇷|Brasile">🇧🇷 Brasile</option><option value="🇨🇦|Canada">🇨🇦 Canada</option><option value="🇨🇳|Cina">🇨🇳 Cina</option><option value="🇭🇷|Croazia">🇭🇷 Croazia</option><option value="🇨🇿|Repubblica Ceca">🇨🇿 Repubblica Ceca</option><option value="🇫🇷|Francia">🇫🇷 Francia</option><option value="🇩🇪|Germania">🇩🇪 Germania</option><option value="🇬🇧|Regno Unito">🇬🇧 Regno Unito</option><option value="🇯🇵|Giappone">🇯🇵 Giappone</option><option value="🇲🇽|Messico">🇲🇽 Messico</option><option value="🇲🇨|Monaco">🇲🇨 Monaco</option><option value="🇳🇱|Paesi Bassi">🇳🇱 Paesi Bassi</option><option value="🇵🇱|Polonia">🇵🇱 Polonia</option><option value="🇵🇹|Portogallo">🇵🇹 Portogallo</option><option value="🇸🇲|San Marino">🇸🇲 San Marino</option><option value="🇸🇬|Singapore">🇸🇬 Singapore</option><option value="🇪🇸|Spagna">🇪🇸 Spagna</option><option value="🇦🇺|Australia">🇦🇺 Australia</option><option value="🇭🇺|Ungheria">🇭🇺 Ungheria</option><option value="🇺🇸|Stati Uniti">🇺🇸 Stati Uniti</option><option value="🇦🇪|Emirati Arabi Uniti">🇦🇪 Emirati Arabi Uniti</option><option value="🇸🇦|Arabia Saudita">🇸🇦 Arabia Saudita</option></select></label><label>Ora<input id="calendarTime" type="time"></label></div><div style="margin-top:14px"><button class="btn primary" type="submit">📅 Aggiungi al calendario</button></div><div id="calendarMsg" class="muted" style="margin-top:10px"></div></form></div><div style="height:14px"></div><div class="card"><div class="toolbar"><h2>📅 Gare in calendario</h2><span class="muted">${calItems.length} appuntamenti</span></div>${calItems.map(([id,r])=>`<div class="calendar-item"><div class="calendar-date">${r.date?`<strong>${esc(new Date(r.date+'T12:00:00').getDate())}</strong><span>${esc(new Intl.DateTimeFormat('it-IT',{month:'short'}).format(new Date(r.date+'T12:00:00')).replace('.',''))}</span>`:'<strong>?</strong><span>data</span>'}</div><div class="calendar-info"><b>${r.flag?`<span class="race-flag">${esc(r.flag)}</span>`:''}${esc(r.name||'Gara FTC')}</b>${r.country?`<span class="calendar-country">${esc(r.country)}</span>`:''}${r.track?`<span class="muted">📍 ${esc(r.track)}</span>`:''}${r.time?`<span class="muted">🕒 ${esc(r.time)}</span>`:''}</div><button class="btn" data-delete-calendar="${esc(id)}">Elimina</button></div>`).join('')||'<div class="empty">Nessuna gara in calendario.</div>'}</div><div style="height:14px"></div><div class="card"><h2>🏁 Inserisci risultato</h2><form id="raceForm"><div class="form"><label>Nome gara<input id="raceName" required placeholder="es. GP del Mugello"></label><label>Data<input id="raceDate" type="date" required></label></div><h3>Risultato — Top 10</h3><div id="resultInputs">${Array.from({length:10},(_,i)=>`<div class="result-row"><b>${i+1}° <span class="muted">${POINTS[i]} pt</span></b><select class="driver-select" required><option value="">Seleziona pilota...</option>${opts}</select></div>`).join('')}</div><div style="margin-top:14px"><button class="btn primary" type="submit">💾 Salva risultato</button></div><div id="saveMsg" class="muted" style="margin-top:10px"></div></form></div><div style="height:14px"></div><div class="card"><h2>🗑️ Gestione gare</h2>${Object.entries(races).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0)).map(([id,r])=>`<div class="race"><div class="race-head"><div><b>${esc(r.name)}</b><div class="muted">${esc(r.date||'')}</div></div><button class="btn" data-delete="${esc(id)}">Elimina</button></div></div>`).join('')||'<div class="empty">Nessuna gara.</div>'}</div>`;
 document.getElementById('logout').onclick=()=>signOut(auth);
 document.getElementById('calendarForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('calendarMsg');try{const calendarRef=push(ref(db,'calendar'));const countryValue=document.getElementById('calendarCountry').value;const countryParts=countryValue?countryValue.split('|'):['',''];await set(calendarRef,{name:document.getElementById('calendarName').value.trim(),date:document.getElementById('calendarDate').value,track:document.getElementById('calendarTrack').value.trim(),time:document.getElementById('calendarTime').value,flag:countryParts[0],country:countryParts[1],createdAt:Date.now(),createdBy:user.uid});msg.textContent='Gara aggiunta al calendario e sincronizzata.';e.target.reset();}catch(err){msg.textContent='Errore nel salvataggio: '+err.message;}};
 document.querySelectorAll('[data-delete-calendar]').forEach(b=>b.onclick=async()=>{if(confirm('Eliminare questa gara dal calendario?')){try{await remove(ref(db,'calendar/'+b.dataset.deleteCalendar));}catch(e){alert('Impossibile eliminare: '+e.message)}}});
 document.getElementById('raceForm').onsubmit=async e=>{e.preventDefault();const selects=[...document.querySelectorAll('.driver-select')];const results=selects.map(s=>s.value);const msg=document.getElementById('saveMsg');if(new Set(results).size!==10){msg.textContent='Ogni pilota deve essere diverso dagli altri.';return;}try{const raceRef=push(ref(db,'races'));await set(raceRef,{name:document.getElementById('raceName').value.trim(),date:document.getElementById('raceDate').value,results,createdAt:Date.now(),createdBy:user.uid});msg.textContent='Gara salvata e sincronizzata.';e.target.reset();}catch(err){msg.textContent='Errore nel salvataggio: '+err.message;}};
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Eliminare questa gara?')){try{await remove(ref(db,'races/'+b.dataset.delete));}catch(e){alert('Impossibile eliminare: '+e.message)}}});
}

function render(){if(page==='home')renderHome();else if(page==='calendar')renderCalendar();else if(page==='races')renderRaces();else renderAdmin();nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();});
onValue(ref(db,'races'),snap=>{races=snap.val()||{};render();},err=>{document.getElementById('status').innerHTML='Connessione: <b style="color:#ff6b6b">errore</b>';console.error(err);});
onValue(ref(db,'calendar'),snap=>{calendar=snap.val()||{};render();},err=>{document.getElementById('status').innerHTML='Connessione: <b style="color:#ff6b6b">errore</b>';console.error(err);});
onAuthStateChanged(auth,u=>{user=u;render();});
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body>
</html>
